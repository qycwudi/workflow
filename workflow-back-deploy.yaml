apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow-back
  namespace: workflow
  labels:
    app: workflow-back
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: workflow-back
  template:
    metadata:
      labels:
        app: workflow-back
    spec:
      containers:
      - name: workflow-back
        image: registry.cn-hangzhou.aliyuncs.com/jenkins_construct_images/workflow:b2
        ports:
        - containerPort: 8888
        env:
        - name: HOST_IP
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.podIP
        - name: POD_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.nodeName
        - name: PORT
          value: '8888'
        - name: API_PORT
          value: '8889'
        - name: LOG_MODE
          value: file
        - name: LOG_LEVEL
          value: info
        - name: REDIS_HOST
          value: 'ido-redis-headless:6379'
        - name: REDIS_PASSWORD
          value: redis123
        - name: REDIS_DB
          value: '10'
        - name: DSN
          value: >-
            root:Root@123@tcp(ido-mysql-headless:3306)/wkflow?charset=utf8mb4&parseTime=True&loc=Local
        readinessProbe:
          tcpSocket:
            port: 8888
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 8888
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1024Mi
        volumeMounts:
        - name: timezone
          mountPath: /etc/localtime
        - name: config-volume
          mountPath: /app/etc/workflow-api.yaml  # 挂载路径更新为 /etc/workflow-api.yaml
          subPath: workflow-api.yaml  # 指定子路径
      volumes:
        - name: timezone
          hostPath:
            path: /usr/share/zoneinfo/Asia/Shanghai
        - name: config-volume
          configMap:
            name: workflow-config

---

apiVersion: v1
kind: Service
metadata:
  name: workflow-back-svc
  namespace: workflow
spec:
  ports:
  - nodePort: 30000                                                                                                            
    port: 8889                                                                                                                 
    protocol: TCP                                                                                                              
    targetPort: 8889  
  selector:
    app: workflow-back
  type: NodePort  

---

apiVersion: v1
kind: Service
metadata:
  name: workflow
  namespace: workflow
spec:
  ports:                                                                                                       
  - port: 8888                                                                                                                 
    protocol: TCP                                                                                                              
    targetPort: 8888
  selector:
    app: workflow-back